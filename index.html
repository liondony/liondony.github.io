<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Liondony's website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #121826, #20293d);
            color: #e2e8f0;
            padding: 48px 24px;
        }
        .wrap {
            max-width: 720px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 48px;
        }
        h1 {
            font-size: 2.3rem;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
        }
        .card-container {
            display: grid;
            gap: 24px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 36px;
            transition: 0.25s ease;
            cursor: pointer;
        }
        .card:hover {
            background: rgba(255,255,255,0.09);
            transform: translateY(-4px);
            border-color: rgba(255,255,255,0.18);
        }
        .card a {
            text-decoration: none;
            color: inherit;
            display:block;
        }
        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            display:flex;
            align-items:center;
            gap:10px;
        }
        .card p {
            color:#94a3b8;
            line-height:1.6;
        }
        footer {
            text-align: center;
            margin-top: 60px;
            color: #64748b;
            font-size: 0.86rem;
        }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>Welcome to Liondony's website</h1>
        <p class="subtitle">Personal Document Library</p>
    </header>

    <div class="card-container">
        <div class="card" onclick="openWorkDoc()">
            <div>
                <h2>📁 工作文档</h2>
                <p>各类工作资料、方案、记录汇总（需密码访问）</p>
            </div>
        </div>
        <div class="card">
            <a href="study.html">
                <h2>📚 个人学习</h2>
                <p>学习笔记、知识文档、思维资料汇总</p>
            </a>
        </div>
    </div>

    <footer>
        © Liondony Personal Website
    </footer>
</div>

<script>
function openWorkDoc(){
    let pwd = prompt("请输入访问密码：");
    if(pwd === "tmfj728"){
        location.href = "work.html";
    }else if(pwd !== null){
        alert("密码错误！");
    }
}
</script>
</body>
</html>
