<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作文档 | Liondony</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #121826, #20293d);
            color: #e2e8f0;
            padding: 48px 24px;
        }
        .wrap {
            max-width:720px;
            margin:0 auto;
        }
        .back {
            margin-bottom:30px;
        }
        .back a {
            color:#60a5fa;
            text-decoration:none;
        }
        .back a:hover {
            text-decoration:underline;
        }
        h1 {
            font-size:1.8rem;
            margin-bottom:30px;
            display:flex;
            align-items:center;
            gap:10px;
        }
        .file-list {
            list-style:none;
        }
        .file-item {
            padding:14px 16px;
            border-radius:10px;
            transition:0.24s;
            margin-bottom:8px;
        }
        .file-item:hover {
            background:rgba(255,255,255,0.06);
        }
        .file-item a {
            display:flex;
            align-items:center;
            gap:12px;
            color:#e2e8f0;
            text-decoration:none;
            font-size:1.02rem;
        }
        .icon {
            color:#60a5fa;
            font-size:18px;
        }
        footer {
            text-align:center;
            margin-top:60px;
            color:#64748b;
            font-size:0.86rem;
        }

        /* 密码弹窗样式 */
        .mask{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.75);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .pwd-box{
            background:#222a3d;
            padding:32px;
            border-radius:14px;
            border:1px solid rgba(255,255,255,0.12);
        }
        .pwd-box h3{
            margin-bottom:16px;
        }
        .pwd-box input{
            width:260px;
            padding:10px 14px;
            font-size:16px;
            border-radius:8px;
            border:none;
            outline:none;
            margin-bottom:16px;
        }
        .btn-group{
            display:flex;
            gap:12px;
        }
        .pwd-box button{
            flex:1;
            padding:9px;
            border-radius:8px;
            border:none;
            cursor:pointer;
            font-size:15px;
        }
        .confirm{
            background:#60a5fa;
            color:#fff;
        }
    </style>
</head>
<body>

            </a>

        -->
    </ul>
    <footer>
        © Liondony Personal Website
    </footer>
</div>

</html>
